<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico & Checklist de Hardware</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 750px;
            margin: 30px auto;
            padding: 0 20px;
        }
        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 { color: var(--accent); margin: 0 0 5px 0; font-size: 1.6rem; }
        p { color: var(--muted); margin: 0; font-size: 0.95rem; }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: #e2e8f0; }
        .item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #33415555;
            cursor: pointer;
        }
        .item:last-child { border-bottom: none; }
        input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }
        .checked { text-decoration: line-through; color: var(--muted); }
        .progress-bar {
            background: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { opacity: 0.9; }
        .btn-pdf { background: var(--success); color: #052e16; }
        .btn-link { background: #334155; color: #f8fafc; border: 1px solid #475569; }
        .btn-reset { background: #475569; color: #fff; }
        textarea {
            width: 100%;
            background: #0f172a;
            color: var(--text);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 10px;
            font-family: inherit;
        }

        /* Formatação limpa para gerar PDF */
        @media print {
            body {
                background: #ffffff;
                color: #0f172a;
                margin: 0;
                max-width: 100%;
            }
            .card {
                background: #ffffff;
                border: 1px solid #cbd5e1;
                break-inside: avoid;
            }
            h1 { color: #0369a1; }
            h2 { color: #1e293b; }
            p, .checked { color: #475569; }
            textarea {
                background: #f8fafc;
                color: #0f172a;
                border: 1px solid #cbd5e1;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Checklist Técnico de Manutenção de Hardware</h1>
        <p>Ferramenta de inspeção preventiva, térmica e diagnóstico de bancada</p>
    </div>
    <button class="btn-link no-print" onclick="copiarLink()">Copiar Link</button>
</header>

<div class="card">
    <h2>Progresso da Bancada: <span id="percent">0%</span></h2>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
</div>

<div class="card">
    <h2>1. Inspeção Física e Limpeza</h2>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Desconexão de energia e descarregamento estático</label>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Remoção de poeira em coolers, dissipadores e filtros</label>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Inspeção visual de capacitores e trilhas da placa-mãe</label>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Limpeza de contatos (RAM e GPU) com álcool isopropílico</label>
</div>

<div class="card">
    <h2>2. Sistema Térmico</h2>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Remoção da pasta térmica ressecada (CPU/GPU)</label>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Verificação e substituição de thermal pads (VRM/Memórias)</label>
    <label class="item"><input type="checkbox" onchange="atualizar()"> Aplicação de nova pasta térmica de alta condutividade</label>
</div>

    <h2>3. Testes de Estabilidade e Sistema</h2>
    <label class="item
